name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: nao-fair-frontend
      - uses: actions/checkout@v5
        with:
          repository: icampus-wildau/nao-fair-server
          path: nao-fair-server
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: nao-fair-frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: nao-fair-frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
        working-directory: nao-fair-server
      - run: pnpm install --frozen-lockfile
        working-directory: nao-fair-frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: nao-fair-frontend
      - run: pnpm run test:e2e
        working-directory: nao-fair-frontend
